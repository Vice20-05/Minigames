# Copy this file, rename the copy to  config.properties  (same folder), and fill in your data.
# config.properties is in .gitignore, so the password never goes to GitHub.
#
# Supabase dashboard -> Connect -> "Session pooler" (NOT "Direct connection", that one
# often doesn't work on home/school internet). Turn the URI into these 3 lines:
#   postgresql://USER:PASSWORD@HOST:5432/postgres
db.url=jdbc:postgresql://aws-0-YOUR-REGION.pooler.supabase.com:5432/postgres?sslmode=require
db.user=postgres.YOUR_PROJECT_REF
db.password=YOUR_DATABASE_PASSWORD
